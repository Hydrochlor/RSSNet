#### general settings
name: ConvTasNet
use_tb_logger: true
num_spks: 2

#### datasets
datasets:
  num_workers: 5
  train_batch_size: 8
  val_batch_size: 32
  upsample: false

  #### set your own dataset path
  train:
    ref_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/prep_spec.txt
    list_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/train/mix_2_spec_train_60000.txt
    mix_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/train/RRUFF_rednoise_10-20_mix_train.txt
  val:
    ref_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/prep_spec.txt
    list_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/val/mix_2_spec_val_5000.txt
    mix_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/val/RRUFF_rednoise_10-20_mix_val.txt
    

#### network structures
ConvTasNet:
  N: 512
  L: 2
  B: 128
  H: 512
  P: 3
  X: 8
  R: 3
  norm: gln
  num_spks: 2
  activate: sigmoid
  causal: false


#### training settings: learning rate scheme, loss
train:
  epoch: 100
  early_stop: 100
  path: /home/ubuntu/RSSNet/train_models/ConvTasNet
  gpuid: [0,1]

#### Optimizer settings
optim:
  name: Adam   ### Adam, RMSprop, SGD
  lr: !!float 1e-4
  momentum: 0
  weight_decay: 0
  clip_norm: 5

#### scheduler settings
scheduler:
  min_lr: !!float 1e-8
  patience: 2
  factor: 0.5

#### Resume training settings
resume:
  state: false
  path: /home/ubuntu/RSSNet/train_models/ConvTasNet


#### logger
logger:
  name: ConvTasNet
  path: /home/ubuntu/RSSNet/train_models/ConvTasNet
  screen: true
  tofile: true
  print_freq: 100