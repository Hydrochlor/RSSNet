#### general settings
name: Dual_Path_RNN
use_tb_logger: true
num_spks: 2

#### datasets
datasets:
  num_workers: 5
  train_batch_size: 8
  val_batch_size: 32
  upsample: false

  #### set your own dataset path
  train:
    ref_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/prep_spec.txt
    list_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/train/mix_2_spec_train_60000.txt
    mix_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/train/RRUFF_rednoise_10-20_mix_train.txt
  val:
    ref_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/prep_spec.txt
    list_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/val/mix_2_spec_val_5000.txt
    mix_path: /home/ubuntu/RSSNet/dataset/RRUFF-2Mix/val/RRUFF_rednoise_10-20_mix_val.txt
    

#### network structures
Dual_Path_RNN:
  in_channels: 256
  out_channels: 64
  hidden_channels: 512
  kernel_size: 2
  rnn_type: LSTM
  norm: gln
  dropout: 0
  bidirectional: true
  num_layers: 8
  K: 45
  num_spks: 2


#### training settings: learning rate scheme, loss
train:
  epoch: 100
  early_stop: 100
  path: /home/ubuntu/RSSNet/train_models/DPRNN_red_noise1
  gpuid: [0,1]

#### Optimizer settings
optim:
  name: Adam   ### Adam, RMSprop, SGD
  lr: !!float 5e-4
  momentum: 0
  weight_decay: 0
  clip_norm: 5

#### scheduler settings
scheduler:
  min_lr: !!float 1e-8
  patience: 2
  factor: 0.5

#### Resume training settings
resume:
  state: false
  path: /home/ubuntu/RSSNet/train_models/DPRNN_red_noise1


#### logger
logger:
  name: DPRNN
  path: /home/ubuntu/RSSNet/train_models/DPRNN_red_noise1
  screen: true
  tofile: true
  print_freq: 100
